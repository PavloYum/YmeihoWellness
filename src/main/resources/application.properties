server.port=8080
server.forward-headers-strategy=framework
spring.application.name=YumeihoWellness

spring.web.resources.cache.cachecontrol.max-age=0

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:/app/data/yumeiho-bookings;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.notification.email=${APP_NOTIFICATION_EMAIL}
app.public-url=${APP_PUBLIC_URL:}
app.admin-token=${APP_ADMIN_TOKEN:}
app.bot-token=${APP_BOT_TOKEN:}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
voucher.hub-url=${VOUCHER_HUB_URL:http://host.docker.internal:8787}
voucher.hub-token=${VOUCHER_HUB_TOKEN:}
voucher.amount-cents=${VOUCHER_AMOUNT_CENTS:6000}
voucher.currency=${VOUCHER_CURRENCY:EUR}
voucher.valid-days=${VOUCHER_VALID_DAYS:90}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
